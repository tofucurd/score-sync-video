name: Package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install audio test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install locked Python dependencies
        run: |
          uv venv .runtime --python 3.14
          uv pip install --python .runtime/bin/python --only-binary :all: -r requirements.lock
      - name: Unit and integration tests
        run: .runtime/bin/python -m pytest tests -q
      - name: JavaScript syntax
        run: |
          node --check scripts/browser_render.mjs
          node --check scripts/cdp-transport.mjs
          node --check scripts/print_pdf.mjs
      - name: Public package integrity
        run: .runtime/bin/python scripts/check_package.py
